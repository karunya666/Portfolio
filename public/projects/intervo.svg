<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="intervoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#intervoBg)"/>

  <!-- Window Header -->
  <rect width="1200" height="48" fill="#1f2937" rx="16"/>
  <circle cx="30" cy="24" r="6" fill="#ef4444"/>
  <circle cx="50" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="24" r="6" fill="#10b981"/>
  <text x="600" y="30" font-family="'Courier New', monospace" font-size="13" fill="#9ca3af" text-anchor="middle">Intervo — Real-Time Collaborative Technical Interview Platform</text>

  <!-- Left Column: Problem description & Stream.io Video -->
  <g transform="translate(30, 70)">
    <!-- Video Stream simulation -->
    <rect width="360" height="230" rx="10" fill="#030712" stroke="#374151" stroke-width="1.5"/>
    <text x="180" y="110" font-family="'Outfit', sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">Stream.io WebRTC Live Channel</text>
    <circle cx="180" cy="70" r="28" fill="#1e293b"/>
    <text x="180" y="78" font-family="'Outfit', sans-serif" font-size="20" fill="#60a5fa" text-anchor="middle">📹</text>
    <rect x="20" y="180" width="100" height="26" rx="6" fill="#ef4444" fill-opacity="0.8"/>
    <text x="70" y="197" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">LIVE • REC</text>
    <text x="330" y="197" font-family="'Courier New', monospace" font-size="12" fill="#4ade80" text-anchor="end">&lt;35ms latency</text>

    <!-- Curated DSA Problem Description -->
    <rect y="250" width="360" height="340" rx="10" fill="#030712" stroke="#374151" stroke-width="1.5"/>
    <text x="25" y="285" font-family="'Outfit', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Problem #42: Trapping Rain Water</text>
    <text x="25" y="315" font-family="'Outfit', sans-serif" font-size="12" fill="#9ca3af">Given n non-negative integers representing an</text>
    <text x="25" y="335" font-family="'Outfit', sans-serif" font-size="12" fill="#9ca3af">elevation map where width of each bar is 1,</text>
    <text x="25" y="355" font-family="'Outfit', sans-serif" font-size="12" fill="#9ca3af">compute how much water it can trap after raining.</text>
    
    <rect x="25" y="380" width="120" height="26" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="85" y="398" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Two Pointers</text>

    <rect x="25" y="430" width="310" height="130" rx="8" fill="#111827"/>
    <text x="40" y="460" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#c084fc">🤖 AI Resume &amp; Prompt Generator</text>
    <text x="40" y="485" font-family="'Outfit', sans-serif" font-size="11" fill="#94a3b8">Synthesized from candidate profile:</text>
    <text x="40" y="505" font-family="'Outfit', sans-serif" font-size="11" fill="#cbd5e1">"Explain the space complexity tradeoff between</text>
    <text x="40" y="525" font-family="'Outfit', sans-serif" font-size="11" fill="#cbd5e1">monotonic stack vs two pointers approach."</text>
  </g>

  <!-- Right Column: Collaborative Monaco Editor & Live JDoodle execution -->
  <g transform="translate(410, 70)">
    <rect width="760" height="580" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="760" height="40" rx="10" fill="#0f172a"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="13" fill="#cbd5e1">Solution.cpp — Collaborative Monaco Session (JDoodle Sandbox)</text>

    <text x="25" y="75" font-family="'Courier New', monospace" font-size="13" fill="#475569">01</text>
    <text x="25" y="105" font-family="'Courier New', monospace" font-size="13" fill="#475569">02</text>
    <text x="25" y="135" font-family="'Courier New', monospace" font-size="13" fill="#475569">03</text>
    <text x="25" y="165" font-family="'Courier New', monospace" font-size="13" fill="#475569">04</text>
    <text x="25" y="195" font-family="'Courier New', monospace" font-size="13" fill="#475569">05</text>
    <text x="25" y="225" font-family="'Courier New', monospace" font-size="13" fill="#475569">06</text>

    <text x="65" y="75" font-family="'Courier New', monospace" font-size="13" fill="#60a5fa">#include &lt;vector&gt;</text>
    <text x="65" y="105" font-family="'Courier New', monospace" font-size="13" fill="#c084fc">int</text>
    <text x="95" y="105" font-family="'Courier New', monospace" font-size="13" fill="#38bdf8">trap</text>
    <text x="135" y="105" font-family="'Courier New', monospace" font-size="13" fill="#f8fafc">(std::vector&lt;int&gt;&amp; height) {</text>
    <text x="85" y="135" font-family="'Courier New', monospace" font-size="13" fill="#f8fafc">int left = 0, right = height.size() - 1, water = 0;</text>
    <text x="85" y="165" font-family="'Courier New', monospace" font-size="13" fill="#f8fafc">int maxL = 0, maxR = 0;</text>
    <text x="85" y="195" font-family="'Courier New', monospace" font-size="13" fill="#c084fc">while</text>
    <text x="135" y="195" font-family="'Courier New', monospace" font-size="13" fill="#f8fafc">(left &lt; right) { /* Two-pointer streaming logic */ }</text>
    <text x="85" y="225" font-family="'Courier New', monospace" font-size="13" fill="#c084fc">return</text>
    <text x="145" y="225" font-family="'Courier New', monospace" font-size="13" fill="#f8fafc">water;</text>

    <!-- JDoodle Output Console -->
    <rect x="25" y="410" width="710" height="145" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
    <text x="45" y="435" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8">Terminal Output (JDoodle Remote Sandbox Execution):</text>
    <text x="45" y="465" font-family="'Courier New', monospace" font-size="13" fill="#4ade80">&gt;&gt; Compilation: SUCCESS (g++ -O3)</text>
    <text x="45" y="490" font-family="'Courier New', monospace" font-size="13" fill="#38bdf8">&gt;&gt; Test cases passed: 15/15 (0.002s execution time)</text>
    <text x="45" y="520" font-family="'Courier New', monospace" font-size="13" fill="#fbbf24">&gt;&gt; Inngest Event: session_completed_dispatch</text>
  </g>
</svg>
