<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="codeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#codeBg)"/>
  
  <!-- Window Header -->
  <rect width="1200" height="48" fill="#0f172a" rx="16"/>
  <circle cx="30" cy="24" r="6" fill="#ef4444"/>
  <circle cx="50" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="24" r="6" fill="#10b981"/>
  <text x="600" y="30" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8" text-anchor="middle">CodeCritic — AI Distributed Code Review Pipeline (LLaMA 3.3 70B)</text>

  <!-- Left: Monaco Editor simulation -->
  <g transform="translate(30, 70)">
    <rect width="660" height="570" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Line numbers & code -->
    <text x="25" y="40" font-family="'Courier New', monospace" font-size="14" fill="#475569">01</text>
    <text x="25" y="70" font-family="'Courier New', monospace" font-size="14" fill="#475569">02</text>
    <text x="25" y="100" font-family="'Courier New', monospace" font-size="14" fill="#475569">03</text>
    <text x="25" y="130" font-family="'Courier New', monospace" font-size="14" fill="#475569">04</text>
    <text x="25" y="160" font-family="'Courier New', monospace" font-size="14" fill="#475569">05</text>
    <text x="25" y="190" font-family="'Courier New', monospace" font-size="14" fill="#475569">06</text>
    <text x="25" y="220" font-family="'Courier New', monospace" font-size="14" fill="#475569">07</text>
    <text x="25" y="250" font-family="'Courier New', monospace" font-size="14" fill="#475569">08</text>
    
    <text x="65" y="40" font-family="'Courier New', monospace" font-size="14" fill="#93c5fd">// Distributed Multi-Language AST Analysis</text>
    <text x="65" y="70" font-family="'Courier New', monospace" font-size="14" fill="#c084fc">export async function</text>
    <text x="270" y="70" font-family="'Courier New', monospace" font-size="14" fill="#60a5fa">reviewCodeStream</text>
    <text x="420" y="70" font-family="'Courier New', monospace" font-size="14" fill="#f8fafc">(payload) {</text>
    <text x="90" y="100" font-family="'Courier New', monospace" font-size="14" fill="#c084fc">const</text>
    <text x="145" y="100" font-family="'Courier New', monospace" font-size="14" fill="#f8fafc">groq = new Groq({ apiKey: env.GROQ_API_KEY });</text>
    <text x="90" y="130" font-family="'Courier New', monospace" font-size="14" fill="#c084fc">const</text>
    <text x="145" y="130" font-family="'Courier New', monospace" font-size="14" fill="#f8fafc">ast = await parseAST(payload.code, payload.language);</text>
    <text x="90" y="160" font-family="'Courier New', monospace" font-size="14" fill="#c084fc">return</text>
    <text x="155" y="160" font-family="'Courier New', monospace" font-size="14" fill="#f8fafc">await groq.chat.completions.create({</text>
    <text x="120" y="190" font-family="'Courier New', monospace" font-size="14" fill="#38bdf8">model: "llama-3.3-70b-versatile",</text>
    <text x="120" y="220" font-family="'Courier New', monospace" font-size="14" fill="#38bdf8">response_format: { type: "json_object" }</text>
    <text x="90" y="250" font-family="'Courier New', monospace" font-size="14" fill="#f8fafc">});</text>
  </g>

  <!-- Right: AI Review Insight Card -->
  <g transform="translate(710, 70)">
    <rect width="460" height="570" rx="10" fill="#090d16" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Big-O Badge -->
    <rect x="25" y="25" width="410" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="45" y="55" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#60a5fa">COMPLEXITY ANALYSIS</text>
    <text x="45" y="78" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#22c55e">Time: O(N log N) • Space: O(1) [Optimal]</text>

    <!-- Review items -->
    <rect x="25" y="115" width="410" height="120" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="45" y="145" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#f59e0b">⚡ Concurrency &amp; Memory Optimization</text>
    <text x="45" y="175" font-family="'Outfit', sans-serif" font-size="12" fill="#9ca3af">Stateless review session avoids memory leaks across 100+</text>
    <text x="45" y="195" font-family="'Outfit', sans-serif" font-size="12" fill="#9ca3af">concurrent active Monaco client connections.</text>

    <!-- Security Check -->
    <rect x="25" y="255" width="410" height="110" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="45" y="285" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🔒 Security Hardening</text>
    <text x="45" y="315" font-family="'Outfit', sans-serif" font-size="12" fill="#9ca3af">Clerk JWT signature validated with Svix webhooks.</text>
    <text x="45" y="335" font-family="'Outfit', sans-serif" font-size="12" fill="#9ca3af">Helmet &amp; CORS protections active for production.</text>

    <!-- Live status -->
    <rect x="25" y="385" width="410" height="150" rx="8" fill="#0f172a" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="415" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#a855f7">🚀 Deployment Architecture</text>
    <text x="45" y="445" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">• Frontend: React / Vite deployed on Vercel</text>
    <text x="45" y="470" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">• Backend: Node.js / Express hosted on Render</text>
    <text x="45" y="495" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">• Database: MongoDB Atlas with indexed replay cache</text>
  </g>
</svg>
