<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#110d18"/>
      <stop offset="100%" stop-color="#1e142b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" rx="16" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="580" rx="12" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="30" y="30" width="840" height="560" rx="8" fill="none" stroke="url(#purpleGrad)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Watermark -->
  <text x="450" y="340" font-family="'Times New Roman', serif" font-size="110" font-weight="900" fill="#ffffff" fill-opacity="0.03" text-anchor="middle" dominant-baseline="middle">MRIDANG 2025</text>

  <!-- Header -->
  <text x="450" y="90" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#d8b4fe" letter-spacing="4" text-anchor="middle">INDIAN INSTITUTE OF INFORMATION TECHNOLOGY, UNA</text>
  <text x="450" y="140" font-family="'Times New Roman', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">CERTIFICATE OF LEADERSHIP &amp; EXCELLENCE</text>
  <text x="450" y="175" font-family="'Outfit', sans-serif" font-size="16" fill="#e9d5ff" text-anchor="middle">MRIDANG 2025 • Annual Cultural Fest of IIIT Una</text>

  <line x1="250" y1="205" x2="650" y2="205" stroke="url(#purpleGrad)" stroke-width="2"/>

  <!-- Body -->
  <text x="450" y="250" font-family="'Outfit', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Awarded to</text>
  <text x="450" y="295" font-family="'Outfit', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">KARUNYA</text>
  <text x="450" y="335" font-family="'Outfit', sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">Event Coordinator — Battle of the Bands</text>

  <g transform="translate(140, 360)">
    <rect width="620" height="70" rx="12" fill="#2e1065" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1"/>
    <text x="310" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#d8b4fe" text-anchor="middle">DISTINGUISHED LEADERSHIP MILESTONE</text>
    <text x="310" y="52" font-family="'Outfit', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">End-to-End Orchestration • 300+ Attendees • 4+ Cross-Functional Teams • 90% Satisfaction</text>
  </g>

  <text x="450" y="465" font-family="'Outfit', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">In recognition of exemplary initiative, operations management, vendor negotiations, and festival execution</text>

  <!-- Seal -->
  <circle cx="450" cy="525" r="32" fill="#3b0764" stroke="url(#gold)" stroke-width="2.5"/>
  <text x="450" y="530" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">IIITU 2025</text>

  <g transform="translate(140, 500)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="58" font-family="'Outfit', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Faculty In-charge</text>
    <text x="90" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#d8b4fe" text-anchor="middle">Fest Committee, IIIT Una</text>
  </g>

  <g transform="translate(580, 500)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="58" font-family="'Outfit', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Credential ID</text>
    <text x="90" y="30" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#d8b4fe" text-anchor="middle">IIITU-MRIDANG-BOB-2025</text>
  </g>
</svg>
