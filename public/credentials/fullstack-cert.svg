<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#071b2d"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" rx="16" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="580" rx="12" fill="none" stroke="#0284c7" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="30" y="30" width="840" height="560" rx="8" fill="none" stroke="url(#cyanBlue)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Watermark -->
  <text x="450" y="340" font-family="'Courier New', monospace" font-size="110" font-weight="900" fill="#ffffff" fill-opacity="0.03" text-anchor="middle" dominant-baseline="middle">{ MERN &amp; NEXT.JS }</text>

  <!-- Header -->
  <text x="450" y="90" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="4" text-anchor="middle">FULL-STACK WEB ARCHITECTURE &amp; SYSTEMS</text>
  <text x="450" y="140" font-family="'Times New Roman', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">CERTIFICATE OF FULL-STACK MASTERY</text>
  <text x="450" y="175" font-family="'Outfit', sans-serif" font-size="16" fill="#7dd3fc" text-anchor="middle">Modern Web Applications, Distributed AI Pipelines &amp; Real-Time Systems</text>

  <line x1="250" y1="205" x2="650" y2="205" stroke="url(#cyanBlue)" stroke-width="2"/>

  <!-- Body -->
  <text x="450" y="250" font-family="'Outfit', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Awarded to</text>
  <text x="450" y="295" font-family="'Outfit', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">KARUNYA</text>
  <text x="450" y="335" font-family="'Outfit', sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">Indian Institute of Information Technology, Una</text>

  <g transform="translate(140, 360)">
    <rect width="620" height="70" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="310" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">VERIFIED CORE CAPABILITIES</text>
    <text x="310" y="52" font-family="'Outfit', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">React • Next.js • Node.js • Express • MongoDB • Groq LLaMA 3.3 • Monaco Editor • Clerk</text>
  </g>

  <text x="450" y="465" font-family="'Outfit', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Architect of production platforms: CodeCritic (AI Code Review) &amp; Intervo (WebRTC Interview Engine)</text>

  <!-- Seal -->
  <circle cx="450" cy="525" r="32" fill="#0c4a6e" stroke="url(#cyanBlue)" stroke-width="2.5"/>
  <text x="450" y="530" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle">MERN &amp; NEXT</text>

  <g transform="translate(140, 500)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="58" font-family="'Outfit', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Issuer</text>
    <text x="90" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">Full-Stack Track</text>
  </g>

  <g transform="translate(580, 500)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="58" font-family="'Outfit', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Credential ID</text>
    <text x="90" y="30" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">MERN-NEXTJS-IIITU-2026</text>
