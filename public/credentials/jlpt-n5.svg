<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Border & Background -->
  <rect width="900" height="620" rx="16" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="580" rx="12" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="30" y="30" width="840" height="560" rx="8" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Japanese Watermark Motif -->
  <text x="450" y="340" font-family="'Segoe UI', 'Noto Sans JP', sans-serif" font-size="140" font-weight="900" fill="#ffffff" fill-opacity="0.03" text-anchor="middle" dominant-baseline="middle">日本語能力試験</text>

  <!-- Header & Official Emblem -->
  <g transform="translate(70, 70)">
    <rect width="70" height="70" rx="10" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.5))"/>
    <image href="/logos/jlpt.png" width="66" height="66" x="2" y="2" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="450" y="90" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#60a5fa" letter-spacing="4" text-anchor="middle">JAPAN FOUNDATION &amp; JEES</text>
  <text x="450" y="140" font-family="'Times New Roman', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">CERTIFICATE OF RESULT AND SCORES</text>
  <text x="450" y="175" font-family="'Noto Sans JP', sans-serif" font-size="20" fill="#93c5fd" text-anchor="middle">日本語能力試験 認定結果及び成績に関する証明書</text>

  <!-- Divider -->
  <line x1="250" y1="205" x2="650" y2="205" stroke="url(#gold)" stroke-width="2"/>

  <!-- Body Content -->
  <text x="450" y="250" font-family="'Outfit', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">This is to certify that</text>
  <text x="450" y="295" font-family="'Outfit', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">KARUNYA</text>
  <text x="450" y="340" font-family="'Outfit', sans-serif" font-size="18" fill="#e2e8f0" text-anchor="middle">has successfully cleared the Japanese Language Proficiency Test</text>
  
  <rect x="340" y="365" width="220" height="48" rx="24" fill="url(#badgeGlow)" filter="drop-shadow(0 4px 12px rgba(59,130,246,0.5))"/>
  <text x="450" y="396" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">LEVEL N5 • PASSED</text>

  <text x="450" y="445" font-family="'Outfit', sans-serif" font-size="17" font-weight="600" fill="#fbbf24" text-anchor="middle">Global Percentile Rank: 94.0 Percentile</text>
  <text x="450" y="475" font-family="'Outfit', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Demonstrated high competence across Language Knowledge, Reading &amp; Listening Comprehension</text>

  <!-- Footer Seal & Sign -->
  <g transform="translate(140, 500)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="58" font-family="'Outfit', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Official Verification</text>
    <text x="90" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">JEES / Japan Foundation</text>
  </g>

  <!-- Gold Seal -->
  <circle cx="450" cy="530" r="34" fill="#0d1b30" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="450" cy="530" r="28" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="450" y="535" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">JLPT 94%</text>

  <g transform="translate(580, 500)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="58" font-family="'Outfit', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Credential ID</text>
    <text x="90" y="30" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">JLPT-N5-94-PERCENTILE</text>
  </g>
</svg>
