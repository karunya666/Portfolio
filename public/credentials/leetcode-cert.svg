<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" rx="16" fill="url(#bg)"/>
  <rect x="20" y="20" width="860" height="580" rx="12" fill="none" stroke="#f97316" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="30" y="30" width="840" height="560" rx="8" fill="none" stroke="#f97316" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Watermark Icon -->
  <text x="450" y="340" font-family="'Courier New', monospace" font-size="120" font-weight="900" fill="#ffffff" fill-opacity="0.03" text-anchor="middle" dominant-baseline="middle">&lt;DSA / CP&gt;</text>

  <!-- Header & Official Emblem -->
  <g transform="translate(70, 70)">
    <rect width="70" height="70" rx="10" fill="#ffffff" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.5))"/>
    <image href="/logos/leetcode.png" width="66" height="66" x="2" y="2" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="450" y="90" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#fb923c" letter-spacing="4" text-anchor="middle">LEETCODE &amp; COMPETITIVE PROGRAMMING MILESTONE</text>
  <text x="450" y="140" font-family="'Times New Roman', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">CERTIFICATE OF ALGORITHMIC EXCELLENCE</text>
  <text x="450" y="175" font-family="'Outfit', sans-serif" font-size="16" fill="#fdba74" text-anchor="middle">LeetCode 1706 • CodeChef 3★ • Codeforces Specialist</text>

  <line x1="250" y1="205" x2="650" y2="205" stroke="url(#orangeGrad)" stroke-width="2"/>

  <!-- Body -->
  <text x="450" y="250" font-family="'Outfit', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Presented to</text>
  <text x="450" y="295" font-family="'Outfit', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">KARUNYA</text>
  <text x="450" y="335" font-family="'Outfit', sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">Username: Karunya32 (LeetCode) • karunya666 (Codeforces &amp; CodeChef)</text>

  <!-- Stat Badges -->
  <g transform="translate(180, 360)">
    <rect width="250" height="60" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <text x="125" y="28" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">PEAK CONTEST RATING</text>
    <text x="125" y="50" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#fbbf24" text-anchor="middle">1706 RATING</text>
  </g>

  <g transform="translate(470, 360)">
    <rect width="250" height="60" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="125" y="28" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">COMPETITIVE STANDINGS</text>
    <text x="125" y="50" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#4ade80" text-anchor="middle">3★ CHEF • CF SPECIALIST</text>
  </g>

  <text x="450" y="460" font-family="'Outfit', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Rigorous problem solving across Dynamic Programming, Graphs, Trees, Heaps, and Binary Search</text>

  <!-- Seal -->
  <circle cx="450" cy="525" r="32" fill="#1c1917" stroke="url(#gold)" stroke-width="2.5"/>
  <text x="450" y="530" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#fbbf24" text-anchor="middle">LC 1706</text>

  <g transform="translate(140, 500)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="58" font-family="'Outfit', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Verified Profile</text>
    <text x="90" y="30" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#fdba74" text-anchor="middle">leetcode.com/u/Karunya32/</text>
  </g>

  <g transform="translate(580, 500)">
    <line x1="0" y1="40" x2="180" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="58" font-family="'Outfit', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Credential ID</text>
    <text x="90" y="30" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#fdba74" text-anchor="middle">LC-KARUNYA32-1522</text>
  </g>
</svg>
