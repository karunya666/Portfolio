<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Glowing Outer Aura -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#accentGlow)" stroke-width="2" stroke-opacity="0.3" filter="url(#glow)"/>
  <circle cx="200" cy="180" r="130" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.4"/>

  <!-- Developer Silhouette with Tech Glasses / Code Ring -->
  <!-- Torso / Jacket -->
  <path d="M 120 340 C 120 270, 150 250, 200 250 C 250 250, 280 270, 280 340 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M 160 340 L 200 280 L 240 340 Z" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Neck -->
  <rect x="185" y="220" width="30" height="40" rx="6" fill="#334155"/>

  <!-- Head -->
  <ellipse cx="200" cy="175" rx="52" ry="60" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- Hair -->
  <path d="M 148 165 C 145 130, 170 110, 200 110 C 235 110, 255 130, 252 165 C 240 145, 230 135, 200 135 C 170 135, 160 145, 148 165 Z" fill="#0f172a"/>

  <!-- Stylish Tech Glasses with Cyan Reflections -->
  <g filter="url(#glow)">
    <rect x="162" y="160" width="32" height="20" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="2"/>
    <rect x="206" y="160" width="32" height="20" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="2"/>
    <line x1="194" y1="168" x2="206" y2="168" stroke="#38bdf8" stroke-width="2"/>
    <!-- Glow lines in lenses -->
    <line x1="166" y1="164" x2="178" y2="176" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="210" y1="164" x2="222" y2="176" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
  </g>

  <!-- Monogram Badge "K" at Bottom Center -->
  <circle cx="200" cy="335" r="24" fill="#0b1329" stroke="url(#accentGlow)" stroke-width="2" filter="url(#glow)"/>
  <text x="200" y="343" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">K</text>

  <!-- Status Ping Dot -->
  <circle cx="260" cy="140" r="4" fill="#22c55e" filter="url(#glow)"/>
</svg>