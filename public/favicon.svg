<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep obsidian space -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Neon Cyan & Electric Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="innerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Rich Multi-layer Glow Filter -->
    <filter id="neonBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="deepBlur"/>
      <feGaussianBlur stdDeviation="10" result="midBlur"/>
      <feGaussianBlur stdDeviation="4" result="coreBlur"/>
      <feMerge>
        <feMergeNode in="deepBlur"/>
        <feMergeNode in="midBlur"/>
        <feMergeNode in="coreBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with 120px corner radius (same as iOS / original site favicon) -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  
  <!-- Outer border rim with subtle cyan glow -->
  <rect x="6" y="6" width="500" height="500" rx="118" fill="none" stroke="#00c6ff" stroke-opacity="0.3" stroke-width="4"/>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="2"/>

